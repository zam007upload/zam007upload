<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0,viewport-fit=cover">
<title>LINE MINI App</title>
  <style>
    body {
  padding: 16px;
}

button {
  display: none;
  width: 100%;
  padding: 8px 0;
  margin: 8px auto;
  -moz-border-radius: 8px;
  -webkit-border-radius: 8px;
  border-radius: 8px;
}

p {
  border-bottom: 1px dashed #ddd;
}

#pictureUrl {
  margin: 0 auto;
  width: 32%;
  display: -moz-box;
  display: -webkit-box;
  display: box;
  -moz-box-pack: center;
  -moz-box-align: center;
  -webkit-box-pack: center;
  -webkit-box-align: center;
  box-pack: center;
  box-align: center;
  -moz-border-radius: 256px;
  -webkit-border-radius: 256px;
  border-radius: 256px;
}

#accessToken,
#utouId {
  display: block;
  overflow: auto;
}

  </style>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body id="body">
  <section id="profile">
    <img id="pictureUrl" src="https://vos.line-scdn.net/imgs/apis/ic_mini.png">
    <p id="userId"></p>
    <p id="displayName"></p>
    <p id="statusMessage"></p>
    <p id="email"></p>
  </section>

  <section id="feature">
    <p id="code"></p>
    <p id="friendShip"></p>
  </section>

  <section id="button">
    <button id="btnShortcut">Add Shortcut</button>
    <button id="btnOpenWindow">Open Window</button>
    <button id="btnSend">Send Message</button>
    <button id="btnShare">Share Target Picker</button>
    <button id="btnScanCode">Scan Code</button>

    <button id="btnLogIn">Log In</button>
    <button id="btnLogOut">Log Out</button>
  </section>
    <script>
        // Import stylesheets
//import './style.css';

// Body element
const body = document.querySelector('#body');

// Button elements
const btnSend = document.querySelector('#btnSend');
const btnShare = document.querySelector('#btnShare');
const btnLogIn = document.querySelector('#btnLogIn');
const btnLogOut = document.querySelector('#btnLogOut');
const btnScanCode = document.querySelector('#btnScanCode');

const btnOpenWindow = document.querySelector('#btnOpenWindow');
const btnShortcut = document.querySelector('#btnShortcut');

// Profile elements
const email = document.querySelector('#email');
const userId = document.querySelector('#userId');
const pictureUrl = document.querySelector('#pictureUrl');
const displayName = document.querySelector('#displayName');
const statusMessage = document.querySelector('#statusMessage');

// QR element
const code = document.querySelector('#code');

// Friendship element
const friendShip = document.querySelector('#friendShip');

async function main() {
  // Initialize LIFF SDK
  await liff.init({ liffId: '2010099410-8YTDyuCM' });

  // Try a function
  switch (liff.getOS()) {
    case 'android':
      body.style.backgroundColor = '#d1f5d3';
      break;
    case 'ios':
      body.style.backgroundColor = '#eeeeee';
      break;
    case 'web':
      body.style.backgroundColor = '#195AEA';
      break;
  }

  // ...
  if (liff.isInClient()) {
    getUserProfile();
    getFriendship();
    btnSend.style.display = 'block';
    btnShare.style.display = 'block';
    btnScanCode.style.display = 'block';
    btnShortcut.style.display = 'block';
  } else {
    if (liff.isLoggedIn()) {
      btnLogIn.style.display = 'none';
      btnLogOut.style.display = 'block';
      btnShare.style.display = 'block';
      btnScanCode.style.display = 'block';
      btnShortcut.style.display = 'block';
      getUserProfile();
      getFriendship();
    } else {
      btnLogIn.style.display = 'block';
      btnLogOut.style.display = 'none';
    }
  }

  btnOpenWindow.style.display = 'block';
}

main();

async function getUserProfile() {
  const profile = await liff.getProfile();
  pictureUrl.src = profile.pictureUrl
    ? profile.pictureUrl
    : 'https://vos.line-scdn.net/imgs/apis/ic_mini.png';
  userId.innerHTML = '<b>userId:</b> ' + profile.userId;
  statusMessage.innerHTML = '<b>statusMessage:</b> ' + profile.statusMessage;
  displayName.innerHTML = '<b>displayName:</b> ' + profile.displayName;
  email.innerHTML = '<b>email:</b> ' + liff.getDecodedIDToken().email;
}

btnLogIn.onclick = () => {
  liff.login();
};

btnLogOut.onclick = () => {
  liff.logout();
  window.location.reload();
};

btnSend.onclick = () => {
  sendMsg();
};

btnShare.onclick = () => {
  shareMsg();
};

btnScanCode.onclick = () => {
  scanCode();
};

btnOpenWindow.onclick = () => {
  liff.openWindow({
    url: window.location.href,
    external: true,
  });
};

btnShortcut.onclick = async () => {
  await liff.createShortcutOnHomeScreen({
    url: 'https://miniapp.line.me/2010099410-8YTDyuCM',
  });
};

async function sendMsg() {
  if (
    liff.getContext().type !== 'none' &&
    liff.getContext().type !== 'external'
  ) {
    await liff.sendMessages([
      {
        type: 'text',
        text: JSON.stringify(liff.getContext()),//'This message TTTT',
      },
    ]);
    liff.closeWindow();
    //alert("Message sent")
  }
}

async function shareMsg() {
  await liff.shareTargetPicker([
    {
      type: 'image',
      originalContentUrl: 'https://vos.line-scdn.net/imgs/apis/ic_mini.png',
      previewImageUrl: 'https://vos.line-scdn.net/imgs/apis/ic_mini.png',
    },
  ]);
}

async function scanCode() {
  const result = await liff.scanCodeV2();
  code.innerHTML = '<b>Code: </b>' + result.value;
}

async function getFriendship() {
  let msg = 'Hooray! You and our chatbot are friend.';
  const friend = await liff.getFriendship();
  if (!friend.friendFlag) {
    msg =
      '<a href="https://line.me/R/ti/p/@171kguff">Follow our chatbot here!</a>';
  }
  friendShip.innerHTML = msg;
}


    </script>
</body>
</html>
